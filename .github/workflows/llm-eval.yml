name: LLM Eval (L1 判官)
on:
  pull_request:
    types: [labeled, synchronize]
  schedule: [{cron: "0 18 * * *"}]      # 每日 02:00 CST
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  l1:
    # 只在 PR 打了 affects-generation 标签、或 nightly 时跑（省钱）
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'affects-generation')
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      JUDGE_GATE_ENABLED: ${{ vars.JUDGE_GATE_ENABLED }}
    steps:
      - uses: actions/checkout@3d3f42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: make setup
      - run: make db-rebuild
      - name: 成本预算护栏（超预算直接失败，不是超支后报告）
        run: uv run nsc eval l1 --sample ${{ github.event_name == 'schedule' && 40 || 12 }} --max-cost-usd 3.0
      - name: 判官门禁（仅在 JUDGE_GATE_ENABLED=true 且聚合分低于阈值时阻塞，D6/D8）
        run: uv run python -m nsc.eval.gate --thresholds eval/thresholds.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: l1-report
          path: out/eval/
          if-no-files-found: ignore
      - name: 在 PR 上贴报告
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          path: out/eval/l1.md
