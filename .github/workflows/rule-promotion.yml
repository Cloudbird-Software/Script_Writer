name: Rule Promotion (每周挖掘)
on:
  schedule: [{cron: "0 2 * * 1"}]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  mine:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3f42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: make setup && make db-rebuild
      - name: L0→L1 聚类归纳
        run: uv run nsc mine run
      - name: L1→L2 留出集验证
        run: uv run nsc mine validate --report out/mining/validation.md
      - name: 退役检查
        run: uv run nsc mine retire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mining-validation
          path: out/mining/
          if-no-files-found: ignore
      # BP-1：挖掘产物走 PR 进 main（人工 approve 才能进 L3）
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: bot/rule-candidates
          title: "规则候选（自动挖掘 $(date +%F)）"
          body-path: out/mining/validation.md
          labels: |
            rule-candidate
            asset-change
          commit-message: "feat(rules): 本周规则候选与退役"
