name: Flywheel Dashboard (每周六个数)
on:
  schedule: [{cron: "0 3 * * 1"}]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3f42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: make setup && make db-rebuild
      - run: uv run nsc metrics weekly --write out/metrics/
      - name: 北极星回归告警（D22：结构性编辑率必须单调下降）
        run: uv run python -m nsc.metrics.northstar_alert --window 8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: metrics-weekly
          path: out/metrics/
          if-no-files-found: ignore
      # BP-1：main 仅经 PR 进入，周报不再直推 git；仪表盘 = Issue 评论 + artifact
      - uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        continue-on-error: true
        with:
          issue-number: 2 # 固定的"飞轮周报"Issue（#2）
          body-path: out/metrics/latest.md
